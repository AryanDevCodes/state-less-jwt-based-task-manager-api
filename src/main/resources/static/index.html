<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="container">
    <header class="hero">
      <h1>Task Manager</h1>
      <p>Simple JWT-based task tracking UI</p>
    </header>

    <section id="authCard" class="card">
      <div class="tabs">
        <button id="loginTab" class="tab active" type="button">Login</button>
        <button id="registerTab" class="tab" type="button">Register</button>
      </div>

      <form id="loginForm" class="form">
        <label>Email
          <input id="loginEmail" type="email" required />
        </label>
        <label>Password
          <input id="loginPassword" type="password" required />
        </label>
        <button class="primary" type="submit">Sign in</button>
        <div class="divider">or</div>
        <a href="/oauth2/authorization/google" class="btn-google">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Sign in with Google
        </a>
      </form>

      <form id="registerForm" class="form hidden">
        <label>Name
          <input id="registerName" type="text" required />
        </label>
        <label>Email
          <input id="registerEmail" type="email" required />
        </label>
        <label>Password
          <input id="registerPassword" type="password" required />
        </label>
        <button class="primary" type="submit">Create account</button>
      </form>
      <p id="authMessage" class="message"></p>
    </section>

    <section id="appCard" class="card hidden">
      <div class="toolbar">
        <strong id="currentUser">Signed in</strong>
        <button id="logoutBtn" class="ghost" type="button">Logout</button>
      </div>

      <form id="taskForm" class="form row">
        <input id="taskHeadline" type="text" placeholder="Headline" required />
        <input id="taskDescription" type="text" placeholder="Description" required />
        <button class="primary" type="submit">Add task</button>
      </form>

      <div class="task-controls" style="margin-bottom:10px;">
        <label>Page <input id="taskPage" type="number" min="0" value="0" style="width:50px;"></label>
        <label>Size <input id="taskSize" type="number" min="1" value="10" style="width:50px;"></label>
        <label>Sort by
          <select id="taskSortBy">
            <option value="taskId">Task ID</option>
            <option value="headLine">Headline</option>
          </select>
        </label>
        <label>Direction
          <select id="taskDirection">
            <option value="asc">Asc</option>
            <option value="desc">Desc</option>
          </select>
        </label>
        <button id="taskReloadBtn" type="button">Reload</button>
      </div>
      <ul id="taskList" class="task-list"></ul>
      <p id="taskMessage" class="message"></p>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
